<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Щоденник агронома</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- адаптивність -->
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f4f4f4; padding:20px; }
    h1 { color:#4CAF50; text-align:center; }
    label { display:block; margin-top:10px; }
    input, select, textarea { width:100%; padding:8px; margin-top:5px; }
    button { margin-top:10px; padding:10px; background:#4CAF50; color:white; border:none; cursor:pointer; border-radius:4px; }
    button:hover { background:#45a049; }
    .entry { background:white; padding:10px; margin-top:10px; border:1px solid #ccc; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:left; }
    th { background-color:#dcedc8; }

    @media (max-width:768px) {
      h1 { font-size:22px; }
      table { font-size:14px; }
      button { font-size:16px; }
    }

    nav { background:#333; padding:10px; position:relative; }
    nav button { background:none; border:none; color:black; font-size:26px; cursor:pointer; position:absolute; right:10px; top:10px; }
    #menuOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:998; }
    #burgerMenu { 
      display:none; position:fixed; top:0; right:0; height:100%; width:80%; max-width:300px; 
      background:#222; padding:20px; box-shadow:-2px 0 5px rgba(0,0,0,0.5); z-index:999; 
      transition:transform 0.3s ease; transform:translateX(100%);
    }
    #burgerMenu a { color:white; display:block; padding:15px; text-decoration:none; font-size:20px; }
    #burgerMenu button { background:none; border:none; color:white; font-size:28px; cursor:pointer; position:absolute; left:15px; top:15px; }
  </style>
</head>
<body>

<!-- Меню-бургер -->
<nav>
  <button onclick="toggleMenu()">☰</button>
  <div id="menuOverlay" onclick="toggleMenu()"></div>
  <div id="burgerMenu">
    <button onclick="toggleMenu()">✖</button>
    <a href="index.html">Головна</a>
    <a href="diary.html">Щоденник</a>
    <a href="calculator.html">Калькулятори</a>
    <a href="knowledge.html">База знань</a>
    <a href="gallery.html">Галерея</a>
    <a href="fields.html">Поля</a>
    <a href="sowing.html">Посівна</a>
    <a href="equipment.html">Техніка</a>
    <a href="expenses.html">Витрати</a>
    <a href="harvest.html">Урожай</a>
  </div>
</nav>

<h1>Щоденник агронома</h1>

<label for="crop">Культура:</label>
<select id="crop">
  <option value="">-- Оберіть культуру --</option>
  <option value="пшениця">Пшениця</option>
  <option value="овес">Овес</option>
  <option value="ячмінь">Ячмінь</option>
  <option value="соя">Соя</option>
  <option value="кукурудза">Кукурудза</option>
  <option value="картопля">Картопля</option>
  <option value="соняшник">Соняшник</option>
  <option value="ріпак">Ріпак</option>
  <option value="гречка">Гречка</option>
  <option value="буряк">Буряк</option>
  <option value="люцерна">Люцерна</option>
  <option value="горох">Горох</option>
  <option value="льон">Льон</option>
  <option value="конюшина">Конюшина</option>
  <option value="жито">Жито</option>
  <option value="просо">Просо</option>
  <option value="нут">Нут</option>
  <option value="сорго">Сорго</option>
</select>

<label for="date">Дата:</label>
<input type="date" id="date">

<label for="note">Нотатка:</label>
<textarea id="note"></textarea>

<button onclick="addEntry()">Додати запис</button>

<h2>Записи:</h2>
<div id="entries"></div>
<script>
  // Меню-бургер
  function toggleMenu() {
    const menu = document.getElementById("burgerMenu");
    const overlay = document.getElementById("menuOverlay");
    if (menu.style.display === "none" || menu.style.display === "") {
      menu.style.display = "block";
      overlay.style.display = "block";
      setTimeout(() => menu.style.transform = "translateX(0)", 10);
    } else {
      menu.style.transform = "translateX(100%)";
      setTimeout(() => {
        menu.style.display = "none";
        overlay.style.display = "none";
      }, 300);
    }
  }

  // Підказки для культур
  function getHints(crop) {
    const hints = {
      'пшениця': { посів:'вересень-жовтень', добрива:'азотні, фосфорні', полив:'помірний', шкідники:'жужелиця', урожайність:'4–6 т/га' },
      'овес': { посів:'рання весна', добрива:'азотні помірно', полив:'мінімальний', шкідники:'попелиці', урожайність:'2–3 т/га' },
      'ячмінь': { посів:'весна', добрива:'азотні, калійні', полив:'важливий у колосінні', шкідники:'трипси', урожайність:'3–5 т/га' },
      'соя': { посів:'травень', добрива:'фосфорні, калійні', полив:'регулярний', шкідники:'совка', урожайність:'2–3 т/га' },
      'кукурудза': { посів:'квітень-травень', добрива:'азотні багато', полив:'регулярний', шкідники:'метелик', урожайність:'6–10 т/га' },
      'картопля': { посів:'квітень-травень', добрива:'органічні, калійні', полив:'регулярний', шкідники:'колорадський жук', урожайність:'20–30 т/га' },
      'соняшник': { посів:'квітень', добрива:'азотні, калійні', полив:'помірний', шкідники:'міль', урожайність:'2–3 т/га' },
      'ріпак': { посів:'серпень', добрива:'азотні, сірковмісні', полив:'помірний', шкідники:'квіткоїд', урожайність:'3–4 т/га' },
      'гречка': { посів:'травень-червень', добрива:'фосфорні', полив:'мінімальний', шкідники:'клопи', урожайність:'1–2 т/га' },
      'буряк': { посів:'квітень', добрива:'азотні, калійні', полив:'регулярний', шкідники:'довгоносик', урожайність:'40–60 т/га' },
      'люцерна': { посів:'весна', добрива:'фосфорні', полив:'регулярний', шкідники:'довгоносик', урожайність:'10–15 т/га зеленої маси' },
      'горох': { посів:'рання весна', добрива:'фосфорні, калійні', полив:'помірний', шкідники:'зернівка', урожайність:'2–3 т/га' },
      'льон': { посів:'весна', добрива:'азотні мало', полив:'помірний', шкідники:'блішка', урожайність:'1–2 т/га' },
      'конюшина': { посів:'весна', добрива:'фосфорні, калійні', полив:'регулярний', шкідники:'довгоносик', урожайність:'5–7 т/га зеленої маси' },
      'жито': { посів:'осінь', добрива:'азотні', полив:'мінімальний', шкідники:'житоїд', урожайність:'3–5 т/га' },
      'просо': { посів:'травень', добрива:'азотні, фосфорні', полив:'помірний', шкідники:'комарик', урожайність:'2–3 т/га' },
      'нут': { посів:'весна', добрива:'фосфорні', полив:'помірний', шкідники:'міль', урожайність:'1–2 т/га' },
      'сорго': { посів:'травень-червень', добрива:'азотні', полив:'помірний', шкідники:'комарик', урожайність:'3–5 т/га' }
    };
    return hints[crop] || null;
  }

  function addEntry(data = null, save = true) {
    const crop = data ? data.crop : document.getElementById('crop').value;
    const date = data ? data.date : document.getElementById('date').value;
    const note = data ? data.note : document.getElementById('note').value;

    if (!crop || !date || !note) return;

    const entryDiv = document.createElement('div');
    entryDiv.className = 'entry';
    entryDiv.innerHTML = `<strong>${date}</strong> — ${crop}<br><span class="note">${note}</span>`;

    const hints = getHints(crop);
    if (hints) {
      let table = "<table><tr><th>Параметр</th><th>Значення</th></tr>";
      for (let key in hints) {
        table += `<tr><td>${key}</td><td>${hints[key]}</td></tr>`;
      }
      table += "</table>";
      entryDiv.innerHTML += table;
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `
      <button onclick="editEntry(this)">Редагувати</button>
      <button onclick="deleteEntry(this)">Видалити</button>
    `;
    entryDiv.appendChild(actions);

    document.getElementById('entries').appendChild(entryDiv);

    if (save) saveData();

    document.getElementById('note').value = '';
    document.getElementById('date').value = '';
  }

  function editEntry(button) {
    const entryDiv = button.parentNode.parentNode;
    const noteSpan = entryDiv.querySelector('.note');
    const oldNote = noteSpan.innerText;

    noteSpan.innerHTML = `<textarea>${oldNote}</textarea>`;
    button.innerText = "Зберегти";
    button.onclick = function() {
      const newNote = noteSpan.querySelector('textarea').value;
      noteSpan.innerText = newNote;
      button.innerText = "Редагувати";
      button.onclick = function() { editEntry(button); };
      saveData();
    };
  }

  function deleteEntry(button) {
    const entryDiv = button.parentNode.parentNode;
    entryDiv.remove();
    saveData();
  }

  function saveData() {
    const entries = document.querySelectorAll('.entry');
    const data = [];
    entries.forEach(entry => {
      const date = entry.querySelector('strong').innerText;
      const crop = entry.innerHTML.split('—')[1].split('<br>')[0].trim();
      const note = entry.querySelector('.note').innerText;
      data.push({ date, crop, note });
    });
    localStorage.setItem("diaryEntries", JSON.stringify(data));
  }

  window.onload = function() {
    const saved = JSON.parse(localStorage.getItem("diaryEntries")) || [];
    saved.forEach(entry => addEntry(entry, false));
  };
</script>

</body>
</html>
