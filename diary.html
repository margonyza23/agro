  <h1>Щоденник агронома</h1>

  <script>
    function getHints(crop) {
      const hints = {
        'пшениця': { посів:'вересень-жовтень', добрива:'азотні, фосфорні', полив:'помірний', шкідники:'жужелиця', урожайність:'4–6 т/га' },
        'овес': { посів:'рання весна', добрива:'азотні помірно', полив:'мінімальний', шкідники:'попелиці', урожайність:'2–3 т/га' },
        'ячмінь': { посів:'весна', добрива:'азотні, калійні', полив:'важливий у колосінні', шкідники:'трипси', урожайність:'3–5 т/га' },
        'соя': { посів:'травень', добрива:'фосфорні, калійні', полив:'регулярний', шкідники:'совка', урожайність:'2–3 т/га' },
        'кукурудза': { посів:'квітень-травень', добрива:'азотні багато', полив:'регулярний', шкідники:'метелик', урожайність:'6–10 т/га' },
        'картопля': { посів:'квітень-травень', добрива:'органічні, калійні', полив:'регулярний', шкідники:'колорадський жук', урожайність:'20–30 т/га' },
        'соняшник': { посів:'квітень', добрива:'азотні, калійні', полив:'помірний', шкідники:'міль', урожайність:'2–3 т/га' },
        'ріпак': { посів:'серпень', добрива:'азотні, сірковмісні', полив:'помірний', шкідники:'квіткоїд', урожайність:'3–4 т/га' },
        'гречка': { посів:'травень-червень', добрива:'фосфорні', полив:'мінімальний', шкідники:'клопи', урожайність:'1–2 т/га' },
        'буряк': { посів:'квітень', добрива:'азотні, калійні', полив:'регулярний', шкідники:'довгоносик', урожайність:'40–60 т/га' },
        'люцерна': { посів:'весна', добрива:'фосфорні', полив:'регулярний', шкідники:'довгоносик', урожайність:'10–15 т/га зеленої маси' },
        'горох': { посів:'рання весна', добрива:'фосфорні, калійні', полив:'помірний', шкідники:'зернівка', урожайність:'2–3 т/га' },
        'льон': { посів:'весна', добрива:'азотні мало', полив:'помірний', шкідники:'блішка', урожайність:'1–2 т/га' },
        'конюшина': { посів:'весна', добрива:'фосфорні, калійні', полив:'регулярний', шкідники:'довгоносик', урожайність:'5–7 т/га зеленої маси' },
        'жито': { посів:'осінь', добрива:'азотні', полив:'мінімальний', шкідники:'житоїд', урожайність:'3–5 т/га' },
        'просо': { посів:'травень', добрива:'азотні, фосфорні', полив:'помірний', шкідники:'комарик', урожайність:'2–3 т/га' },
        'нут': { посів:'весна', добрива:'фосфорні', полив:'помірний', шкідники:'міль', урожайність:'1–2 т/га' },
        'сорго': { посів:'травень-червень', добрива:'азотні', полив:'помірний', шкідники:'комарик', урожайність:'3–5 т/га' }
      };
      return hints[crop] || null;
    }
    
    function addEntry(data = null, save = true) {
  const crop = data ? data.crop : document.getElementById('crop').value;
  const date = data ? data.date : document.getElementById('date').value;
  const note = data ? data.note : document.getElementById('note').value;

  if (!crop || !date || !note) return;

  const entryDiv = document.createElement('div');
  entryDiv.className = 'entry';
  entryDiv.innerHTML = `<strong>${date}</strong> — ${crop}<br><span class="note">${note}</span>`;

  // Додаємо таблицю підказок
  const hints = getHints(crop);
  if (hints) {
    let table = "<table><tr><th>Параметр</th><th>Значення</th></tr>";
    for (let key in hints) {
      table += `<tr><td>${key}</td><td>${hints[key]}</td></tr>`;
    }
    table += "</table>";
    entryDiv.innerHTML += table;
  }

  // Кнопки редагування та видалення
  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML = `
    <button onclick="editEntry(this)">Редагувати</button>
    <button onclick="deleteEntry(this)">Видалити</button>
  `;
  entryDiv.appendChild(actions);

  document.getElementById('entries').appendChild(entryDiv);

  if (save) saveData();

  document.getElementById('note').value = '';
  document.getElementById('date').value = '';
}

// Функція редагування
function editEntry(button) {
  const entryDiv = button.parentNode.parentNode;
  const noteSpan = entryDiv.querySelector('.note');
  const oldNote = noteSpan.innerText;

  noteSpan.innerHTML = `<textarea>${oldNote}</textarea>`;
  button.innerText = "Зберегти";
  button.onclick = function() {
    const newNote = noteSpan.querySelector('textarea').value;
    noteSpan.innerText = newNote;
    button.innerText = "Редагувати";
    button.onclick = function() { editEntry(button); };
    saveData();
  };
}

// Функція видалення
function deleteEntry(button) {
  const entryDiv = button.parentNode.parentNode;
  entryDiv.remove();
  saveData();
}

// Функція збереження у localStorage
function saveData() {
  const entries = document.querySelectorAll('.entry');
  const data = [];
  entries.forEach(entry => {
    const date = entry.querySelector('strong').innerText;
    const crop = entry.innerHTML.split('—')[1].split('<br>')[0].trim();
    const note = entry.querySelector('.note').innerText;
    data.push({ date, crop, note });
  });
  localStorage.setItem("diaryEntries", JSON.stringify(data));
}

// Завантаження збережених записів при відкритті сторінки
window.onload = function() {
  const saved = JSON.parse(localStorage.getItem("diaryEntries")) || [];
  saved.forEach(entry => addEntry(entry, false));
};

</script>
</body>
