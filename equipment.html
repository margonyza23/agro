<script>
  function toggleMenu() {
    const menu = document.getElementById("burgerMenu");
    menu.style.display = menu.style.display === "none" ? "block" : "none";
  }
</script>
  <h1>Таблиця техніки</h1>

  <div>
    <input type="text" id="type" placeholder="Тип техніки">
    <input type="text" id="model" placeholder="Марка / Модель">
    <input type="text" id="inventory" placeholder="Інвентарний №">
    <input type="number" id="year" placeholder="Рік випуску">
    <input type="date" id="lastTO" placeholder="Дата останнього ТО">
    <input type="date" id="nextTO" placeholder="Наступне ТО">
    <input type="text" id="responsible" placeholder="Відповідальний">
    <input type="text" id="condition" placeholder="Стан">
    <input type="text" id="notes" placeholder="Примітки">

    <!-- Нові поля -->
    <input type="text" id="machine" placeholder="Назва техніки">
    <input type="number" id="fuel" placeholder="Паливо (л)">
    <input type="number" id="cost" placeholder="Витрати (грн)">

    <button onclick="addRow()">Додати рядок</button>
  </div>

  <table id="equipmentTable">
    <tr>
      <th>Тип техніки</th>
      <th>Марка / Модель</th>
      <th>Інвентарний №</th>
      <th>Рік випуску</th>
      <th>Дата останнього ТО</th>
      <th>Наступне ТО</th>
      <th>Відповідальний</th>
      <th>Стан</th>
      <th>Примітки</th>
      <th>Назва техніки</th>
      <th>Паливо (л)</th>
      <th>Витрати (грн)</th>
      <th>Дії</th>
    </tr>
  </table>

  <script>
    window.onload = function() {
      const saved = JSON.parse(localStorage.getItem("equipmentData")) || [];
      saved.forEach(row => addRow(row, false));
    };

    function addRow(data = null, save = true) {
      const table = document.getElementById("equipmentTable");
      const row = table.insertRow();

      const type = data ? data.type : document.getElementById("type").value;
      const model = data ? data.model : document.getElementById("model").value;
      const inventory = data ? data.inventory : document.getElementById("inventory").value;
      const year = data ? data.year : document.getElementById("year").value;
      const lastTO = data ? data.lastTO : document.getElementById("lastTO").value;
      const nextTO = data ? data.nextTO : document.getElementById("nextTO").value;
      const responsible = data ? data.responsible : document.getElementById("responsible").value;
      const condition = data ? data.condition : document.getElementById("condition").value;
      const notes = data ? data.notes : document.getElementById("notes").value;
      const machine = data ? data.machine : document.getElementById("machine").value;
      const fuel = data ? data.fuel : document.getElementById("fuel").value;
      const cost = data ? data.cost : document.getElementById("cost").value;

      const values = [type, model, inventory, year, lastTO, nextTO, responsible, condition, notes, machine, fuel, cost];
      values.forEach(v => row.insertCell().innerText = v);

      const actions = row.insertCell();
      actions.innerHTML = `
        <button onclick="editRow(this)">Редагувати</button>
        <button onclick="deleteRow(this)">Видалити</button>
      `;

      if (save) saveData();

      document.querySelectorAll('input').forEach(i => i.value = '');
    }

    function editRow(button) {
      const row = button.parentNode.parentNode;
      const cells = row.getElementsByTagName("td");

      for (let i = 0; i < cells.length - 1; i++) {
        const value = cells[i].innerText;
        cells[i].innerHTML = `<input value="${value}">`;
      }

      button.innerText = "Зберегти";
      button.onclick = function() {
        for (let i = 0; i < cells.length - 1; i++) {
          const input = cells[i].querySelector("input");
          cells[i].innerText = input.value;
        }
        button.innerText = "Редагувати";
        button.onclick = function() { editRow(button); };
        saveData();
      };
    }

    function deleteRow(button) {
      const row = button.parentNode.parentNode;
      row.parentNode.removeChild(row);
      saveData();
    }

    function saveData() {
      const table = document.getElementById("equipmentTable");
      const rows = table.rows;
      const data = [];

      for (let i = 1; i < rows.length; i++) {
        const cells = rows[i].cells;
        data.push({
          type: cells[0].innerText,
          model: cells[1].innerText,
          inventory: cells[2].innerText,
          year: cells[3].innerText,
          lastTO: cells[4].innerText,
          nextTO: cells[5].innerText,
          responsible: cells[6].innerText,
          condition: cells[7].innerText,
          notes: cells[8].innerText,
          machine: cells[9].innerText,
          fuel: cells[10].innerText,
          cost: cells[11].innerText
        });
      }

      localStorage.setItem("equipmentData", JSON.stringify(data));
    }
  </script>
</body>
</html>
