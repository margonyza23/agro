<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1 { color: #4CAF50; text-align: center; }
    .block { background: #fff; padding: 15px; margin: 15px auto; border: 1px solid #ccc; width: 300px; }
    input { margin: 5px; padding: 8px; width: 90%; }
    button { padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; width: 100%; }
    button:hover { background: #45a049; }
    #loginResult { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Вхід у систему</h1>

  <div class="block">
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Пароль" required>
      <button type="submit">Увійти</button>
    </form>
    <p id="loginResult"></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!email || !password) {
        document.getElementById("loginResult").innerText = "❌ Заповніть усі поля!";
        return;
      }

      // Отримуємо дані користувача з localStorage
      const userData = localStorage.getItem("user_" + email);

      if (!userData) {
        document.getElementById("loginResult").innerText = "❌ Користувача з таким email не знайдено!";
        return;
      }

      const user = JSON.parse(userData);

      if (user.password === password) {
        // Зберігаємо активного користувача
        localStorage.setItem("activeUser", JSON.stringify(user));

        // Повідомлення про успішний вхід
        document.getElementById("loginResult").innerText =
          "✅ Вхід виконано! Вітаємо, " + user.username + ". Перехід на головну...";

        // Автоматичний перехід через 2 секунди
        setTimeout(function() {
          window.location.href = "index.html";
        }, 2000);
      } else {
        document.getElementById("loginResult").innerText = "❌ Неправильний пароль!";
      }
    });
  </script>
</body>
</html>
