<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Витрати</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1 { color: #4CAF50; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }

    th { background-color: #dcedc8; }
    input { padding: 5px; margin: 5px; }
    button { padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; margin: 5px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
 <!-- Меню-бургер -->

  <!-- Іконка бургер -->

          style="background:none; border:none; color:rgb(8, 8, 8); font-size:26px; cursor:pointer; position:absolute; right:10px; top:10px;">
    ☰
  </button>

  <!-- Приховане меню (бокова панель) -->

       style="display:none; position:fixed; top:0; right:0; height:100%; width:250px; background:#222; padding:20px; box-shadow:-2px 0 5px rgba(0,0,0,0.5); z-index:999;">
    
    <!-- Кнопка закриття -->

            style="background:none; border:none; color:white; font-size:24px; cursor:pointer; position:absolute; left:10px; top:10px;">
      ✖
    </button>

    <a href="index.html" style="color:white; display:block; padding:10px; text-decoration:none;">Головна</a>
    <a href="diary.html" style="color:white; display:block; padding:10px; text-decoration:none;">Щоденник</a>
    <a href="calculator.html" style="color:white; display:block; padding:10px; text-decoration:none;">Калькулятори</a>
    <a href="knowledge.html" style="color:white; display:block; padding:10px; text-decoration:none;">База знань</a>
    <a href="gallery.html" style="color:white; display:block; padding:10px; text-decoration:none;">Галерея</a>
    <a href="fields.html" style="color:white; display:block; padding:10px; text-decoration:none;">Поля</a>
    <a href="sowing.html" style="color:white; display:block; padding:10px; text-decoration:none;">Посівна</a>

<script>
  function toggleMenu() {
    const menu = document.getElementById("burgerMenu");
    menu.style.display = menu.style.display === "none" ? "block" : "none";
  }
</script>
  <h1>Таблиця витрат</h1>

  <div>
    <input type="date" id="date" placeholder="Дата">
    <input type="text" id="field" placeholder="Поле">
    <input type="text" id="type" placeholder="Тип витрат (насіння, ЗЗР, добрива, паливо тощо)">
    <input type="number" id="amount" placeholder="Кількість">
    <input type="number" id="price" placeholder="Ціна (грн)">
    <button onclick="addRow()">Додати рядок</button>
  </div>

  <table id="expensesTable">
    <tr>
      <th>Дата</th>
      <th>Поле</th>
      <th>Тип витрат</th>
      <th>Кількість</th>
      <th>Ціна (грн)</th>
      <th>Дії</th>
    </tr>
  </table>

  <script>
    window.onload = function() {
      const saved = JSON.parse(localStorage.getItem("expensesData")) || [];
      saved.forEach(row => addRow(row, false));
    };

    function addRow(data = null, save = true) {
      const table = document.getElementById("expensesTable");
      const row = table.insertRow();

      const date = data ? data.date : document.getElementById("date").value;
      const field = data ? data.field : document.getElementById("field").value;
      const type = data ? data.type : document.getElementById("type").value;
      const amount = data ? data.amount : document.getElementById("amount").value;
      const price = data ? data.price : document.getElementById("price").value;

      row.insertCell(0).innerText = date;
      row.insertCell(1).innerText = field;
      row.insertCell(2).innerText = type;
      row.insertCell(3).innerText = amount;
      row.insertCell(4).innerText = price;

      const actions = row.insertCell(5);
      actions.innerHTML = `
        <button onclick="editRow(this)">Редагувати</button>
        <button onclick="deleteRow(this)">Видалити</button>
      `;

      if (save) saveData();

      document.querySelectorAll('input').forEach(i => i.value = '');
    }

    function editRow(button) {
      const row = button.parentNode.parentNode;
      const cells = row.getElementsByTagName("td");

      for (let i = 0; i < cells.length - 1; i++) {
        const value = cells[i].innerText;
        cells[i].innerHTML = `<input value="${value}">`;
      }

      button.innerText = "Зберегти";
      button.onclick = function() {
        for (let i = 0; i < cells.length - 1; i++) {
          const input = cells[i].querySelector("input");
          cells[i].innerText = input.value;
        }
        button.innerText = "Редагувати";
        button.onclick = function() { editRow(button); };
        saveData();
      };
    }

    function deleteRow(button) {
      const row = button.parentNode.parentNode;
      row.parentNode.removeChild(row);
      saveData();
    }

    function saveData() {
      const table = document.getElementById("expensesTable");
      const rows = table.rows;
      const data = [];

      for (let i = 1; i < rows.length; i++) {
        const cells = rows[i].cells;
        data.push({
          date: cells[0].innerText,
          field: cells[1].innerText,
          type: cells[2].innerText,
          amount: cells[3].innerText,
          price: cells[4].innerText
        });
      }

      localStorage.setItem("expensesData", JSON.stringify(data));
    }
  </script>
</body>
</html>
